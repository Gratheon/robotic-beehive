# Klipper configuration for the Robotic Beehive.
#
# Board: BTT Octopus v1.1 / Octopus Pro (STM32). Pin names follow BTT's
# published pinout; check them against your board revision before powering
# motors. Host: Klipper + Moonraker on the Jetson Orin Nano.
#
# Axes are manual_steppers in millimetres of absolute height (see
# hivebot/config.py). The Python orchestrator (hivebot) sends moves; this file
# only describes hardware.
#
#   MOTOR0  lift_left      NEMA23  external DM542   TR16x4
#   MOTOR1  lift_right     NEMA23  external DM542   TR16x4
#   MOTOR2  scan_left      NEMA23  external DM542   TR16x4
#   MOTOR3  scan_right     NEMA23  external DM542   TR16x4
#   MOTOR4  shuttle_left   NEMA17  TMC2209          GT2 20T
#   MOTOR5  shuttle_right  NEMA17  TMC2209          GT2 20T
#
# DM542 wiring: take STEP/DIR/EN from the MOTOR0-3 driver sockets through an
# "external driver adapter" (3.3 V -> 5 V buffered). PUL-/DIR-/ENA- to GND,
# PUL+/DIR+/ENA+ to the buffered signals. DIP switches: 1600 pulses/rev
# (8 microsteps), current = motor rated current, half-current at standstill ON.

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_CHANGE_ME-if00

[printer]
kinematics: none
max_velocity: 80
max_accel: 400

# --- vertical axes (DM542) --------------------------------------------------
[manual_stepper lift_left]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 8
full_steps_per_rotation: 200
rotation_distance: 4
step_pulse_duration: 0.000005
velocity: 15
accel: 40
endstop_pin: ^PG6

[manual_stepper lift_right]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
microsteps: 8
full_steps_per_rotation: 200
rotation_distance: 4
step_pulse_duration: 0.000005
velocity: 15
accel: 40
endstop_pin: ^PG9

[manual_stepper scan_left]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 8
full_steps_per_rotation: 200
rotation_distance: 4
step_pulse_duration: 0.000005
velocity: 40
accel: 80
endstop_pin: ^PG10

[manual_stepper scan_right]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
microsteps: 8
full_steps_per_rotation: 200
rotation_distance: 4
step_pulse_duration: 0.000005
velocity: 40
accel: 80
endstop_pin: ^PG11

# --- shuttles (TMC2209 on the board) ----------------------------------------
[manual_stepper shuttle_left]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 40
velocity: 80
accel: 400
endstop_pin: ^PG12

[tmc2209 manual_stepper shuttle_left]
uart_pin: PF2
run_current: 0.8
stealthchop_threshold: 999999   # StealthChop always: quiet for the bees

[manual_stepper shuttle_right]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
microsteps: 16
rotation_distance: 40
velocity: 80
accel: 400
endstop_pin: ^PG13

[tmc2209 manual_stepper shuttle_right]
uart_pin: PE4
run_current: 0.8
stealthchop_threshold: 999999

# --- servos -----------------------------------------------------------------
# Waterproof metal-gear servos (DS3218 class), powered from the 6 V buck, not
# from the board. Only the signal wire goes to these pins.
[servo fork_left]
pin: PB6
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025
initial_angle: 0

[servo fork_right]
pin: PB7
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025
initial_angle: 0

[servo hook_left]
pin: PE12
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025
initial_angle: 0

[servo hook_right]
pin: PE13
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025
initial_angle: 0

# --- inputs -------------------------------------------------------------------
# Inputs are polled by hivebot via Moonraker (gcode_button state).
[gcode_macro _NOOP]
gcode:
  G4 P0

# Inductive M8 sensors (NPN, 3 mm range) that find the steel frame pins.
# Feed them from 24 V; the signal goes through the endstop port's pull-up and
# a 10k/4.7k divider or an optocoupler.
[gcode_button pin_left]
pin: ^!PG14
press_gcode: _NOOP
release_gcode: _NOOP

[gcode_button pin_right]
pin: ^!PG15
press_gcode: _NOOP
release_gcode: _NOOP

# Door and E-stop are wired normally-closed, so a broken wire reads as unsafe.
# Both also cut the 24 V motor rail in hardware; these inputs are for logging
# and for refusing to start.
[gcode_button door_closed]
pin: ^!PE14
press_gcode: _NOOP
release_gcode: _NOOP
  M112

[gcode_button estop_ok]
pin: ^!PE15
press_gcode: _NOOP
release_gcode: _NOOP
  M112

# --- outputs ------------------------------------------------------------------
[output_pin strobe]        # 24 V white LED bars on the cameras (FAN0 MOSFET)
pin: PA8
value: 0

[output_pin red_light]     # 24 V deep-red (660 nm) work light (FAN1 MOSFET)
pin: PE5
pwm: True
value: 0

[fan_generic crown_fan]    # crown bay exhaust (FAN2)
pin: PD12

# --- cabinet heater ------------------------------------------------------------
# 24 V PTC fan heater on HE0, NTC 100k in the cabinet air near the hive.
[heater_generic cabinet]
heater_pin: PA2
sensor_type: Generic 3950
sensor_pin: PF4
control: watermark
max_delta: 1.0
min_temp: -30
max_temp: 45

[verify_heater cabinet]
max_error: 120
check_gain_time: 900
hysteresis: 5
heating_gain: 1

[temperature_sensor crown]
sensor_type: temperature_host   # Jetson SoC temperature

[idle_timeout]
timeout: 600
gcode:
  M84   # screws are self-locking: dropping power holds position

[force_move]
enable_force_move: True   # service jogging from the Mainsail/Fluidd UI

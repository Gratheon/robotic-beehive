[tool.ruff]
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "B905"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.analysis]
# Hardware and camera libraries that only exist on the robot
allowed-unresolved-imports = ["Jetson.**", "gpiozero", "readchar", "cv2"]

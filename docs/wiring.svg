<text x="552" y="114" class="w" fill="#c2410c">24 V</text>
<path d="M550,136 L576,136 L576,470 L590,470" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#ac2410c)"/>
<path d="M300,270 L280,270 L280,640 L1172,640 L1172,90 L1160,90" fill="none" stroke="#b91c1c" stroke-width="3" marker-end="url(#ab91c1c)"/>
<text x="600" y="634" class="w" fill="#b91c1c">24 V motor rail (switched) → DM542 ×4, board motor input</text>
<path d="M425,420 L425,660 L1180,660 L1180,228 L1160,228" fill="none" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#ab91c1c)"/>
<text x="600" y="676" class="w" fill="#b91c1c">6 V servo bus</text>
<path d="M715,132 L715,160" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#a047857)"/>
<text x="722" y="150" class="w" fill="#047857">LTE / GNSS / Wi-Fi</text>
<path d="M590,110 L584,110 L584,500 L590,500" fill="none" stroke="#047857" stroke-width="1.8" marker-end="url(#a047857)"/>
<text x="540" y="454" class="w" fill="#047857">LoRa</text>
<path d="M715,252 L715,280" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a7c3aed)"/>
<text x="722" y="270" class="w" fill="#7c3aed">USB</text>

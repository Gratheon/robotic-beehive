<text x="432" y="320" class="w" fill="#b91c1c">switched</text>
<path d="M550,350 L564,350 L564,206 L590,206" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#ac2410c)"/>
<text x="520" y="195" class="w" fill="#c2410c">19 V</text>
<path d="M550,366 L572,366 L572,582 L590,582" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#ac2410c)"/>
<text x="540" y="600" class="w" fill="#c2410c">5 V</text>
